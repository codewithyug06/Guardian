server:
  port: 8000

spring:
  application:
    name: guardian-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

guardian:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
  supabase:
    url: ${SUPABASE_URL:}
    key: ${SUPABASE_KEY:}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  policy:
    file-path: ${POLICY_FILE_PATH:../internal_policy.txt}

logging:
  level:
    root: INFO
    com.guardian: DEBUG
